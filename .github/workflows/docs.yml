name: Dokumen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  periksa-dokumen:
    name: Sinkronisasi & gaya dokumen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Uji mandiri pemeriksa dokumen
        run: node tools/self-test-docs.mjs

      - name: plan.txt sinkron dengan README.md
        run: node tools/sync-plan.mjs --check

      - name: Gaya tulisan & tautan
        run: node tools/check-docs.mjs
